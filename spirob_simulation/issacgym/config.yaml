# SpiRob MuJoCo Configuration

# Simulation parameters
substeps: 10                  # Physics steps per control step
max_episode_steps: 500        # Maximum steps per episode

# Robot parameters
grasp_threshold: 0.025        # Distance threshold for grasping
lift_height: 0.08             # Height threshold for successful lift
max_tension: 40.0             # Maximum allowed cable tension

# Reward parameters
distance_reward_scale: 10.0   # Scale for distance-based reward
grasp_reward: 10.0            # Reward for grasping the object
lift_reward: 50.0             # Additional reward for lifting the object
tension_penalty: 0.1          # Penalty factor for excessive tension
time_penalty: 0.1             # Small penalty per timestep for efficiency

# Environment configuration
randomize_object: true        # Whether to randomize object position on reset

# Task parameters
task_type: "pick_and_place"   # Can be "pick_and_place" or "catch"